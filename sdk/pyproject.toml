[project]
name = "taskforge-sdk"
version = "0.1.1"
description = "Python client for the TaskForge distributed job engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/Olufemooshegs/taskforge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
